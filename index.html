<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>捐血系統</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
</head>
<body>

  <header class="site-header">
    <h1>🩸 捐血系統</h1>
    <div class="subtitle">請選擇您要進行的作業</div>
  </header>

  <main class="container">

    <div class="home-banner">
      <img src="oav-logo.png" alt="仕興機械" class="banner-logo">
      <div class="event-title hidden" id="eventTitle"></div>
      <p>感謝您的愛心，請依流程完成報名與報到</p>
    </div>

    <section class="current-number-card" aria-live="polite">
      <div class="current-number-label">當前號碼</div>
      <div class="current-number-value" id="currentNumber">----</div>
      <div class="waiting-range hidden" id="waitingRange"></div>
      <div class="current-number-note">請重新整理以確認目前叫號</div>
    </section>

    <nav class="nav-grid">
      <a href="pre-donation.html" class="nav-btn register">
        <span class="icon">📝</span>
        <div class="info">
          <div class="label">表單填寫</div>
          <div class="desc">報名 / 現場報到，取得報到編號</div>
        </div>
        <span>›</span>
      </a>

      <a href="post-donation.html" class="nav-btn donation hidden" id="postDonationLink">
        <span class="icon">🏅</span>
        <div class="info">
          <div class="label">捐血後填寫</div>
          <div class="desc">捐血完畢後填寫捐血結果</div>
        </div>
        <span>›</span>
      </a>
    </nav>

  </main>

  <script>
    const WAITING_RANGE_SIZE = 5; // 當前號碼之後幾號請到現場等候

    function pad4(num) {
      return String(num).padStart(4, '0');
    }

    function showWaitingRange(current) {
      const el = document.getElementById('waitingRange');
      const start = current + 1;
      const end = Math.min(current + WAITING_RANGE_SIZE, 9999);
      if (start > 9999) return;
      el.textContent = pad4(start) + ' ~ ' + pad4(end) + ' 請到現場等候';
      el.classList.remove('hidden');
    }

    async function loadCurrentNumber() {
      try {
        const res = await fetch(CONFIG.GAS_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'get_current_call_number' }),
        });
        const data = await res.json();
        if (data.status === 'success' && data.number) {
          document.getElementById('currentNumber').textContent = pad4(data.number);
          const current = parseInt(data.number, 10);
          if (!isNaN(current)) showWaitingRange(current);
        }
      } catch (err) {
        document.getElementById('currentNumber').textContent = '----';
      }
    }

    async function loadEventTitle() {
      try {
        const res = await fetch(CONFIG.GAS_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'get_event_title' }),
        });
        const data = await res.json();
        if (data.status === 'success' && data.title) {
          const el = document.getElementById('eventTitle');
          el.textContent = data.title;
          el.classList.remove('hidden');
        }
      } catch (err) {
        // 讀取失敗時不顯示標題
      }
    }

    async function loadPostDonationStatus() {
      try {
        const res = await fetch(CONFIG.GAS_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'get_post_donation_status' }),
        });
        const data = await res.json();
        if (data.status === 'success' && data.active === true) {
          document.getElementById('postDonationLink').classList.remove('hidden');
        }
      } catch (err) {
        // 讀取失敗時維持隱藏
      }
    }

    loadCurrentNumber();
    loadEventTitle();
    loadPostDonationStatus();
  </script>
</body>
</html>
